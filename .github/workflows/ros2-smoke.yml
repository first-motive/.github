name: ROS2 smoke

# Bring a stack up headless and assert it reached a working state. This replaces
# the `timeout N; exit 124 == pass` pattern, which is green for a launch that came
# up and published nothing — it cannot distinguish a running stack from a hung one.
#
# A caller must assert something: with expect-nodes, expect-topics, and
# expect-controllers all empty the job fails immediately, because a smoke that
# cannot fail must not merge.
#
#   jobs:
#     smoke:
#       uses: first-motive/.github/.github/workflows/ros2-smoke.yml@main
#       with:
#         repos-file: fm-robot.repos
#         build-externals: openarm_description unitree_ros2
#         launch: ros2 launch fm_bringup sim.launch.py robot:=g1_d sim_backend:=mock
#         expect-nodes: /controller_manager /robot_state_publisher
#         expect-controllers: g1_right_arm_controller
#         expect-topics: /joint_states

on:
  workflow_call:
    inputs:
      distro:
        description: ROS2 distribution. Humble is the fleet's LTS target.
        type: string
        default: humble
      repos-file:
        description: vcstool manifest to import. Empty skips the import.
        type: string
        default: ""
      build-externals:
        description: >-
          Space-separated external packages to BUILD. Everything else the manifest
          imports is COLCON_IGNORE'd.
        type: string
        default: ""
      apt-packages:
        description: Space-separated apt packages to install before rosdep.
        type: string
        default: ""
      pip-packages:
        description: >-
          Space-separated Python packages a launched node imports that rosdep cannot
          resolve — a native wheel like mujoco, a TUI framework. Installed with uv
          into the container's system Python, which is the interpreter ROS uses.
        type: string
        default: ""
      rosdep-strict:
        description: Fail the job when rosdep cannot resolve a dependency.
        type: boolean
        default: true
      launch:
        description: >-
          Command that brings the stack up and keeps running. Runs with the ROS
          distro and the built overlay sourced, backgrounded, output to a log.
        type: string
        required: true
      expect-nodes:
        description: Space-separated node names that must appear in `ros2 node list`.
        type: string
        default: ""
      expect-topics:
        description: >-
          Space-separated topics that must deliver at least one message inside the
          window. This is the check that a silent loop cannot pass.
        type: string
        default: ""
      expect-controllers:
        description: Space-separated controllers that must reach state `active`.
        type: string
        default: ""
      ready-timeout:
        description: Seconds to wait for every assertion to come true.
        type: number
        default: 90
      topic-timeout:
        description: Seconds to wait for a single message on each expected topic.
        type: number
        default: 15
      runs-on:
        description: Runner, as JSON — a string label or an array of labels.
        type: string
        default: '"ubuntu-latest"'
      timeout-minutes:
        type: number
        default: 40

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ inputs.distro }})
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    container: ros:${{ inputs.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A caller that asserts nothing gets a red job, not a green one. Without this
      # the workflow would silently accept the exact contract it exists to remove.
      - name: Assertions declared
        env:
          NODES: ${{ inputs.expect-nodes }}
          TOPICS: ${{ inputs.expect-topics }}
          CONTROLLERS: ${{ inputs.expect-controllers }}
        run: |
          set -euo pipefail
          if [ -z "${NODES}${TOPICS}${CONTROLLERS}" ]; then
            echo "FAIL: no expect-nodes, expect-topics, or expect-controllers given."
            echo "A smoke that asserts nothing cannot fail, and must not merge."
            exit 1
          fi
          echo "assertions declared"

      - name: Import + mark externals
        if: inputs.repos-file != ''
        env:
          REPOS_FILE: ${{ inputs.repos-file }}
          BUILD_EXTERNALS: ${{ inputs.build-externals }}
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y python3-vcstool
          vcs import < "$REPOS_FILE"
          # nullglob: a manifest that imports no external/ must not leave the literal
          # glob behind for touch to choke on under set -e.
          shopt -s nullglob
          for d in external/*/; do touch "${d}COLCON_IGNORE"; done
          for name in $BUILD_EXTERNALS; do
            rm -f "external/$name/COLCON_IGNORE"
            if [ -d "external/$name/example/src" ]; then
              touch "external/$name/example/src/COLCON_IGNORE"
            fi
          done
          echo "externals imported"

      - uses: astral-sh/setup-uv@v7
        if: inputs.pip-packages != ''

      # colcon resolves neither install_requires nor a lazily imported native wheel,
      # so a node can build clean and then die on its first import. That failure is
      # exactly what the state asserts below are meant to surface, not to trip over.
      - name: Install Python deps
        if: inputs.pip-packages != ''
        env:
          PIP_PACKAGES: ${{ inputs.pip-packages }}
        run: |
          set -eo pipefail
          uv pip install --system $PIP_PACKAGES

      - name: Install ROS deps
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
          DISTRO: ${{ inputs.distro }}
        run: |
          # No -u: ROS's setup.bash reads unset variables by design.
          set -eo pipefail
          source "/opt/ros/$DISTRO/setup.bash"
          # The base image ships no package lists, so rosdep's apt-get install would
          # 404 without this update.
          apt-get update
          if [ -n "$APT_PACKAGES" ]; then
            apt-get install -y $APT_PACKAGES
          fi
          rosdep update
          paths="."
          [ -d external ] && paths="$paths external"
          if [ "${{ inputs.rosdep-strict }}" = "true" ]; then
            rosdep install --from-paths $paths --ignore-src -y -r
          else
            rosdep install --from-paths $paths --ignore-src -y -r || \
              echo "rosdep left dependencies unresolved — the build step decides"
          fi

      - name: colcon build
        env:
          DISTRO: ${{ inputs.distro }}
        run: |
          set -eo pipefail
          source "/opt/ros/$DISTRO/setup.bash"
          colcon build --symlink-install

      - name: Launch + assert state
        env:
          DISTRO: ${{ inputs.distro }}
          LAUNCH: ${{ inputs.launch }}
          NODES: ${{ inputs.expect-nodes }}
          TOPICS: ${{ inputs.expect-topics }}
          CONTROLLERS: ${{ inputs.expect-controllers }}
          READY_TIMEOUT: ${{ inputs.ready-timeout }}
          TOPIC_TIMEOUT: ${{ inputs.topic-timeout }}
        run: |
          # Not -e: every assertion runs, and failures aggregate at the end, so one
          # red check still reports the state of the others.
          set -uo pipefail
          source "/opt/ros/$DISTRO/setup.bash"
          source install/setup.bash

          fails=0
          pass() { echo "PASS: $1"; }
          fail() { echo "FAIL: $1"; fails=$((fails + 1)); }

          # `ros2 control` comes from ros2controlcli, which the base image does not
          # ship. Without this guard a missing CLI reads as "controller not active
          # yet" and the job fails with a misleading message.
          if [ -n "$CONTROLLERS" ] && ! ros2 control list_controllers --help >/dev/null 2>&1; then
            echo "FAIL: expect-controllers given but ros2controlcli is not installed."
            echo "Add ros-${DISTRO}-ros2controlcli to apt-packages."
            exit 1
          fi

          echo "==> launching: $LAUNCH"
          bash -c "$LAUNCH" >/tmp/smoke.log 2>&1 &
          launch_pid=$!

          # Nodes and controllers are polled together: both are "has the stack
          # reached this state yet", and one deadline covers the whole bring-up.
          deadline=$((SECONDS + READY_TIMEOUT))
          nodes_left="$NODES"
          controllers_left="$CONTROLLERS"
          while [ $SECONDS -lt $deadline ]; do
            # A launch that died takes its assertions with it — stop waiting on a
            # stack that is no longer coming up.
            if ! kill -0 "$launch_pid" 2>/dev/null; then
              echo "launch exited early (see log below)"
              break
            fi
            if [ -n "$nodes_left" ]; then
              node_list="$(ros2 node list 2>/dev/null)"
              still=""
              for n in $nodes_left; do
                grep -qxF "$n" <<<"$node_list" || still="$still $n"
              done
              nodes_left="${still# }"
            fi
            if [ -n "$controllers_left" ]; then
              ctrl_list="$(ros2 control list_controllers 2>/dev/null)"
              still=""
              for c in $controllers_left; do
                # list_controllers prints `name[type/Class] state`. Anchor on the name
                # followed by a non-identifier character, and require `active` as a
                # whole word — an unanchored `.*active` also matches `inactive`.
                grep -qE "^${c}[^a-zA-Z0-9_].*[[:space:]]active([[:space:]]|$)" \
                  <<<"$ctrl_list" || still="$still $c"
              done
              controllers_left="${still# }"
            fi
            [ -z "$nodes_left$controllers_left" ] && break
            sleep 2
          done

          for n in $NODES; do
            case " $nodes_left " in
              *" $n "*) fail "node $n never appeared in ros2 node list" ;;
              *) pass "node $n up" ;;
            esac
          done
          for c in $CONTROLLERS; do
            case " $controllers_left " in
              *" $c "*) fail "controller $c never reached active" ;;
              *) pass "controller $c active" ;;
            esac
          done

          # The assertion a silent stack cannot pass: a real message, on the wire,
          # inside the window.
          for t in $TOPICS; do
            if timeout "$TOPIC_TIMEOUT" ros2 topic echo --once "$t" >/tmp/topic.out 2>/dev/null &&
               [ -s /tmp/topic.out ]; then
              pass "topic $t published within ${TOPIC_TIMEOUT}s"
            else
              fail "topic $t published nothing within ${TOPIC_TIMEOUT}s"
            fi
          done

          # Bounded teardown: a plain `wait` blocks forever when a launch child
          # ignores SIGTERM, which hangs the job until the runner's own timeout.
          kill "$launch_pid" 2>/dev/null || true
          for _ in $(seq 1 15); do
            kill -0 "$launch_pid" 2>/dev/null || break
            sleep 1
          done
          kill -9 "$launch_pid" 2>/dev/null || true

          echo "==> smoke: ${fails} failure(s)"
          if [ "$fails" -ne 0 ]; then
            echo "==> launch log (last 60 lines)"
            tail -60 /tmp/smoke.log || true
          fi
          [ "$fails" -eq 0 ]
