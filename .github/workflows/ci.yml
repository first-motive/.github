name: CI

# The org repo had no CI of its own. Everything in it is called by other repos —
# reusable workflows, the scripts they run, the ADR they cite — so a change here
# reaches every consumer before anyone reviews it. That makes a direct push to
# this default branch the most expensive one in the org, and it was the only one
# nothing watched.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # This repo owns the tripwire, and calls it on itself. The called job guards on
  # push-to-default, so it skips on a pull request.
  # Job-level permissions replace the workflow-level block for this job alone:
  # opening the issue needs issues:write, which no other job here is granted.
  tripwire:
    uses: first-motive/.github/.github/workflows/direct-push-tripwire.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read

  # Rendered artifacts land here too — the palette, the renderer, the pull
  # request template — so this repo is graded by the same check it ships.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # The changed-only selection decides which packages a pull request skips, and
  # a wrong answer skips a build silently instead of failing one. Its fixtures
  # run here, against this repo's own copy of the script.
  changed-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: changed-packages fixtures
        run: bash scripts/test-changed-packages.sh
